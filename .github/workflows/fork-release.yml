# Fork-only: publishes a GitHub release of decrypted/dbflux for a `v<X.Y.Z>-d.<N>` tag on
# `local/build`. X.Y.Z is the workspace version without its pre-release part, N counts the fork's
# releases of that base and restarts at 1 when the base changes. Tags are cut with the local tool
# dbflux-release.sh, never by hand. Not meant for upstream.
name: Fork release

on:
  push:
    tags:
      - 'v*-d.*'
  workflow_dispatch:
    inputs:
      tag:
        # A dispatch builds the ref it runs on, so it has to run on the tag itself:
        # gh workflow run fork-release.yml --repo decrypted/dbflux --ref <tag> -f tag=<tag>
        description: 'Release tag to (re)build, e.g. v0.10.0-d.1; run the workflow on that tag'
        required: true
        type: string

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The fork CI signing key (`dbflux fork CI (decrypted/dbflux)`), not upstream's. The release job
  # refuses to publish when GPG_PRIVATE_KEY holds a different key.
  FORK_KEY_FINGERPRINT: 527F909CB6650DF3C3F7B410EF24E6D33BC0C1EC

jobs:
  version:
    name: Resolve release version
    if: github.repository == 'decrypted/dbflux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag against Cargo.toml
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"

          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is on $GITHUB_REF, not on tag $TAG. Run it on the tag: gh workflow run fork-release.yml --repo $GITHUB_REPOSITORY --ref $TAG -f tag=$TAG"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-d\.([1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG is not v<X.Y.Z>-d.<N> (N from 1)."
            exit 1
          fi
          TAG_BASE="${BASH_REMATCH[1]}"

          CARGO_VERSION=$(grep '^version = "' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          CARGO_BASE="${CARGO_VERSION%%[-+]*}"
          if [ "$TAG_BASE" != "$CARGO_BASE" ]; then
            echo "::error::Tag $TAG is for base $TAG_BASE, but Cargo.toml at this commit has $CARGO_VERSION (base $CARGO_BASE). Tag v${CARGO_BASE}-d.<N> instead."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/local/build; then
            echo "::error::Tag $TAG points at $(git rev-parse --short HEAD), which is not on local/build."
            exit 1
          fi

          echo "Releasing $TAG: version ${TAG#v}, commit $(git rev-parse HEAD), Cargo.toml $CARGO_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      actions: read  # required by the reusable build workflow's Windows signing job
    with:
      version: ${{ needs.version.outputs.version }}
      # See fork-build.yml: `rc` packages under the stable identity without AppImage update
      # information pointing at upstream, and the fork cannot sign stable/rc Windows builds.
      channel: rc
      prerelease: true
      # A tag run saves its cache under the tag, where no later run can read it, and it would
      # evict the local/build caches the push builds live on; a tag run cannot read those either.
      cache: false
      windows: false
      extra_features: no-update-check
    secrets: inherit

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: "{linux,macos}-*"
          merge-multiple: false

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify, collect and checksum the packages
        env:
          IMPORTED_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ "$IMPORTED_FINGERPRINT" != "$FORK_KEY_FINGERPRINT" ]; then
            echo "::error::GPG_PRIVATE_KEY is $IMPORTED_FINGERPRINT, expected the fork key $FORK_KEY_FINGERPRINT."
            exit 1
          fi

          for expected in linux-amd64 linux-arm64 macos-amd64 macos-arm64; do
            [ -d "artifacts/$expected" ] || { echo "::error::Artifact $expected is missing."; exit 1; }
          done

          for dir in artifacts/*/; do
            (cd "$dir" && sha256sum --strict -c ./*.sha256)
            for signature in "$dir"*.asc; do
              gpg --batch --verify "$signature" "${signature%.asc}"
            done
          done

          mkdir dist
          for file in artifacts/*/*; do
            name=$(basename "$file")
            if [ -e "dist/$name" ]; then
              echo "::error::Two artifacts are named $name."
              exit 1
            fi
            cp "$file" "dist/$name"
          done
          # The whole changelog as of the tag, for readers who want more than this release's entries;
          # listed in SHA256SUMS like the packages.
          cp CHANGELOG.md dist/CHANGELOG.md

          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name '*.sha256' ! -name '*.asc' ! -name '*.zsync' -printf '%f\n' \
              | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          )
          gpg --batch --armor --detach-sign dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          cat dist/SHA256SUMS
          ls -l dist

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          UPSTREAM_URL: https://github.com/0xErwin1/dbflux.git
        run: |
          set -euo pipefail

          # The [Unreleased] section of CHANGELOG.md at a revision, as one line per entry:
          # "<section>\t<entry>", continuation lines of an entry joined with \x1f.
          unreleased_entries() {
            git show "$1:CHANGELOG.md" 2>/dev/null \
              | awk '/^## / { inside = ($0 ~ /^## \[Unreleased\]/); next } inside' \
              | awk -v US=$'\x1f' '
                  function flush() { if (entry != "") print section "\t" entry; entry = "" }
                  /^### /           { flush(); section = substr($0, 5); next }
                  /^[*-] /          { flush(); entry = $0; next }
                  /^[ \t]+[^ \t]/   { if (entry != "") { entry = entry US $0; next } }
                  { flush() }
                  END { flush() }'
          }

          # Entries of $1 whose text is not among the entries of $2 (a section move is not new).
          new_entries() {
            awk -F'\t' 'NR == FNR { seen[$2] = 1; next } !($2 in seen)' "$2" "$1"
          }

          # Groups entries by section in order of appearance. With COMPACT=1 an entry keeps
          # only its bold title, for a body that would exceed GitHub's size limit.
          render() {
            awk -F'\t' -v US=$'\x1f' -v compact="${COMPACT:-0}" -v level="$1" '
              {
                if (!($1 in index_of)) { index_of[$1] = ++count; name[count] = $1 }
                text = $2
                if (compact == 1) {
                  cut = index(text, " \342\200\224 ")
                  if (cut > 0) text = substr(text, 1, cut - 1)
                  else { sub(US ".*", "", text) }
                }
                gsub(US, "\n", text)
                body[index_of[$1]] = body[index_of[$1]] text "\n"
              }
              END { for (i = 1; i <= count; i++) printf "%s %s\n\n%s\n", level, name[i], body[i] }'
          }

          git fetch --quiet --no-tags "$UPSTREAM_URL" main:refs/remotes/upstream/main
          UPSTREAM_BASE=$(git merge-base HEAD upstream/main)

          # The release tag sorting right before this one, empty for the first release.
          PREV_TAG=$(git tag -l 'v*-d.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-d\.[0-9]+$' | { cat; echo "$TAG"; } \
            | sort -Vu | grep -B1 -Fx "$TAG" | head -n1 || true)
          [ "$PREV_TAG" != "$TAG" ] || PREV_TAG=""
          if [ -n "$PREV_TAG" ]; then
            BASELINE="$PREV_TAG"
          else
            BASELINE="$UPSTREAM_BASE"
          fi

          unreleased_entries HEAD > current.tsv
          unreleased_entries "$BASELINE" > baseline.tsv
          unreleased_entries "$UPSTREAM_BASE" > upstream.tsv
          new_entries current.tsv baseline.tsv > new.tsv
          new_entries new.tsv upstream.tsv > new-fork.tsv
          awk -F'\t' 'NR == FNR { up[$2] = 1; next } ($2 in up)' upstream.tsv new.tsv > new-upstream.tsv

          # Fork pull requests whose head is in this release and not in the baseline, or whose
          # branch was merged in by a local merge commit since the baseline.
          git log --merges --format=%s "$BASELINE..HEAD" \
            | sed -nE "s/^Merge (remote-tracking )?branch '(origin\/)?([^']+)'.*/\3/p" | sort -u > merged-branches.txt
          : > prs.md
          if gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 300 \
              --json number,title,headRefName,headRefOid \
              --jq '.[] | [.number, .headRefName, .headRefOid, .title] | @tsv' > prs.tsv; then
            while IFS=$'\t' read -r number branch head title; do
              contained=false
              if grep -qFx "$branch" merged-branches.txt; then
                contained=true
              elif git cat-file -e "$head^{commit}" 2>/dev/null \
                  && git merge-base --is-ancestor "$head" HEAD \
                  && ! git merge-base --is-ancestor "$head" "$BASELINE"; then
                contained=true
              fi
              if $contained; then
                echo "- #$number $title" >> prs.md
              fi
            done < <(sort -n prs.tsv)
          else
            echo "::warning::Could not list the fork's pull requests; the release notes leave them out."
          fi

          compose() {
            {
              echo "Build of the decrypted/dbflux fork (integration branch \`local/build\`), commit \`$(git rev-parse --short HEAD)\`, on top of upstream 0xErwin1/dbflux \`$(git rev-parse --short "$UPSTREAM_BASE")\`. Built with the \`no-update-check\` feature: it never checks for or offers upstream updates. Linux and macOS only."
              echo
              if [ -n "$PREV_TAG" ]; then
                echo "## Fork changes since $PREV_TAG"
              else
                echo "## Fork changes (not in upstream)"
              fi
              echo
              if [ -s new-fork.tsv ]; then render '###' < new-fork.tsv; else echo "No new changelog entries."; echo; fi
              if [ -s new-upstream.tsv ]; then
                echo "## From upstream since $PREV_TAG"
                echo
                render '###' < new-upstream.tsv
              fi
              if [ -s prs.md ]; then
                echo "## Fork pull requests"
                echo
                cat prs.md
                echo
              fi
              echo "## Verify"
              echo
              echo "Every file is signed with the fork CI key, not upstream's: \`dbflux fork CI (decrypted/dbflux)\`, fingerprint \`$(echo "$FORK_KEY_FINGERPRINT" | sed -E 's/(.{4})/\1 /g; s/ $//')\`."
              echo
              echo '```'
              echo "sha256sum -c --ignore-missing SHA256SUMS"
              echo "gpg --verify SHA256SUMS.asc SHA256SUMS"
              echo '```'
              if [ -n "$PREV_TAG" ]; then
                echo
                echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
              fi
            } > release_body.md
          }

          compose
          if [ "$(wc -c < release_body.md)" -gt 120000 ]; then
            echo "::warning::Release notes exceed GitHub's limit; listing entry titles only."
            COMPACT=1 compose
          fi
          cat release_body.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: DBFlux ${{ needs.version.outputs.tag }} (decrypted fork)
          body_path: release_body.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
