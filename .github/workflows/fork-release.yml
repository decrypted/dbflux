# Fork-only: publishes a GitHub release of decrypted/dbflux for a `v<X.Y.Z>-d.<N>` tag on
# `local/build`. X.Y.Z is the workspace version without its pre-release part, N counts the fork's
# releases of that base and restarts at 1 when the base changes. Tags are cut with the local tool
# dbflux-release.sh, never by hand. Not meant for upstream.
#
# Job graph: version -> checks -> build (unsigned, no secrets) -> sign (environment `release`,
# the only job that sees the GPG key) -> publish. The release notes are composed in parallel.
# The build jobs run every crate's build script and proc macros, so they never get the key; the
# sign job runs no code from the repository and installs nothing.
name: Fork release

on:
  push:
    tags:
      - 'v*-d.*'
  workflow_dispatch:
    inputs:
      tag:
        # A dispatch builds the ref it runs on, so it has to run on the tag itself:
        # gh workflow run fork-release.yml --repo decrypted/dbflux --ref <tag> -f tag=<tag>
        description: 'Release tag to (re)build, e.g. v0.10.0-d.1; run the workflow on that tag'
        required: true
        type: string

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The fork CI signing key (`dbflux fork CI (decrypted/dbflux)`), not upstream's. The sign job
  # refuses to sign when GPG_PRIVATE_KEY holds a different key.
  FORK_KEY_FINGERPRINT: 527F909CB6650DF3C3F7B410EF24E6D33BC0C1EC

jobs:
  version:
    name: Resolve release version
    if: github.repository == 'decrypted/dbflux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"

          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is on $GITHUB_REF, not on tag $TAG. Run it on the tag: gh workflow run fork-release.yml --repo $GITHUB_REPOSITORY --ref $TAG -f tag=$TAG"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-d\.([1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG is not v<X.Y.Z>-d.<N> (N from 1)."
            exit 1
          fi
          TAG_BASE="${BASH_REMATCH[1]}"

          CARGO_VERSION=$(grep '^version = "' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          CARGO_BASE="${CARGO_VERSION%%[-+]*}"
          if [ "$TAG_BASE" != "$CARGO_BASE" ]; then
            echo "::error::Tag $TAG is for base $TAG_BASE, but Cargo.toml at this commit has $CARGO_VERSION (base $CARGO_BASE). Tag v${CARGO_BASE}-d.<N> instead."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/local/build; then
            echo "::error::Tag $TAG points at $(git rev-parse --short HEAD), which is not on local/build."
            exit 1
          fi

          echo "Releasing $TAG: version ${TAG#v}, commit $(git rev-parse HEAD), Cargo.toml $CARGO_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  checks:
    name: Lockfile and CI contracts
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check Cargo.lock against the manifests
        # See fork-build.yml: the builds cannot use --locked after the version stamp, so the
        # committed lock is checked against the committed manifests before anything builds.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check the CI security contracts
        env:
          DBFLUX_REQUIRE_YAML: "1"
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          python3 scripts/test_workflow_security.py

      - name: Check the static source contracts
        # style.yml does not run in the fork. A left-button on_mouse_down must be a press handler
        # in scripts/mouse_down_allowlist.txt, and generated SQL must quote names and values with
        # the dialect's helper unless the site is in scripts/unquoted_sql_allowlist.txt. A path
        # built from a name must use the SafeFileName sanitizer unless the site is in
        # scripts/file_name_allowlist.txt. Local sockets come only from the dbflux_ipc::socket
        # helpers, never an abstract name. Plain Python over the checkout: no build, no secrets.
        run: |
          python3 scripts/lint.py mouse-down
          python3 scripts/lint.py unquoted-sql
          python3 scripts/lint.py file-names
          python3 scripts/lint.py abstract-sockets

  build:
    name: Build
    needs: [version, checks]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      actions: read  # required by the reusable build workflow's Windows signing job
    with:
      version: ${{ needs.version.outputs.version }}
      # See fork-build.yml: `rc` packages under the stable identity without AppImage update
      # information pointing at upstream. The fork cannot sign Windows (SignPath is upstream's),
      # so Windows ships unsigned.
      channel: rc
      prerelease: true
      # A tag run saves its cache under the tag, where no later run can read it, and it would
      # evict the local/build caches the push builds live on; a tag run cannot read those either.
      # windows_cache: false keeps the Windows job from restoring main's cache as well, so
      # every platform builds cold.
      cache: false
      windows_cache: false
      windows: true
      windows_signing: false
      # The build jobs upload unsigned packages plus .sha256; the sign job below signs them.
      sign_in_build: false
      extra_features: no-update-check
    # No secrets: see fork-build.yml.

  notes:
    name: Compose release notes
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          UPSTREAM_URL: https://github.com/0xErwin1/dbflux.git
        run: |
          set -euo pipefail

          # The [Unreleased] section of CHANGELOG.md at a revision, as one line per entry:
          # "<section>\t<entry>", continuation lines of an entry joined with \x1f.
          unreleased_entries() {
            git show "$1:CHANGELOG.md" 2>/dev/null \
              | awk '/^## / { inside = ($0 ~ /^## \[Unreleased\]/); next } inside' \
              | awk -v US=$'\x1f' '
                  function flush() { if (entry != "") print section "\t" entry; entry = "" }
                  /^### /           { flush(); section = substr($0, 5); next }
                  /^[*-] /          { flush(); entry = $0; next }
                  /^[ \t]+[^ \t]/   { if (entry != "") { entry = entry US $0; next } }
                  { flush() }
                  END { flush() }'
          }

          # Entries of $1 whose text is not among the entries of $2 (a section move is not new).
          new_entries() {
            awk -F'\t' 'NR == FNR { seen[$2] = 1; next } !($2 in seen)' "$2" "$1"
          }

          # Groups entries by section in order of appearance. With COMPACT=1 an entry keeps
          # only its bold title, for a body that would exceed GitHub's size limit.
          render() {
            awk -F'\t' -v US=$'\x1f' -v compact="${COMPACT:-0}" -v level="$1" '
              {
                if (!($1 in index_of)) { index_of[$1] = ++count; name[count] = $1 }
                text = $2
                if (compact == 1) {
                  cut = index(text, " \342\200\224 ")
                  if (cut > 0) text = substr(text, 1, cut - 1)
                  else { sub(US ".*", "", text) }
                }
                gsub(US, "\n", text)
                body[index_of[$1]] = body[index_of[$1]] text "\n"
              }
              END { for (i = 1; i <= count; i++) printf "%s %s\n\n%s\n", level, name[i], body[i] }'
          }

          git fetch --quiet --no-tags "$UPSTREAM_URL" main:refs/remotes/upstream/main
          UPSTREAM_BASE=$(git merge-base HEAD upstream/main)

          # The release tag sorting right before this one, empty for the first release.
          PREV_TAG=$(git tag -l 'v*-d.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-d\.[0-9]+$' | { cat; echo "$TAG"; } \
            | sort -Vu | grep -B1 -Fx "$TAG" | head -n1 || true)
          [ "$PREV_TAG" != "$TAG" ] || PREV_TAG=""
          if [ -n "$PREV_TAG" ]; then
            BASELINE="$PREV_TAG"
          else
            BASELINE="$UPSTREAM_BASE"
          fi

          unreleased_entries HEAD > current.tsv
          unreleased_entries "$BASELINE" > baseline.tsv
          unreleased_entries "$UPSTREAM_BASE" > upstream.tsv
          new_entries current.tsv baseline.tsv > new.tsv
          new_entries new.tsv upstream.tsv > new-fork.tsv
          awk -F'\t' 'NR == FNR { up[$2] = 1; next } ($2 in up)' upstream.tsv new.tsv > new-upstream.tsv

          # Fork pull requests whose head is in this release and not in the baseline, or whose
          # branch was merged in by a local merge commit since the baseline. Only pull requests
          # from branches of this repository: a pull request from someone else's fork could
          # reuse a merged branch name and put its title into the release notes.
          git log --merges --format=%s "$BASELINE..HEAD" \
            | sed -nE "s/^Merge (remote-tracking )?branch '(origin\/)?([^']+)'.*/\3/p" | sort -u > merged-branches.txt
          : > prs.md
          if gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 300 \
              --json number,title,headRefName,headRefOid,isCrossRepository \
              --jq '.[] | select(.isCrossRepository == false) | [.number, .headRefName, .headRefOid, .title] | @tsv' > prs.tsv; then
            while IFS=$'\t' read -r number branch head title; do
              contained=false
              if grep -qFx "$branch" merged-branches.txt; then
                contained=true
              elif git cat-file -e "$head^{commit}" 2>/dev/null \
                  && git merge-base --is-ancestor "$head" HEAD \
                  && ! git merge-base --is-ancestor "$head" "$BASELINE"; then
                contained=true
              fi
              if $contained; then
                echo "- #$number $title" >> prs.md
              fi
            done < <(sort -n prs.tsv)
          else
            echo "::warning::Could not list the fork's pull requests; the release notes leave them out."
          fi

          compose() {
            {
              echo "Build of the decrypted/dbflux fork (integration branch \`local/build\`), commit \`$(git rev-parse --short HEAD)\`, on top of upstream 0xErwin1/dbflux \`$(git rev-parse --short "$UPSTREAM_BASE")\`. Built with the \`no-update-check\` feature: it never checks for or offers upstream updates. Linux, macOS and Windows; the Windows files carry no Authenticode signature."
              echo
              if [ -n "$PREV_TAG" ]; then
                echo "## Fork changes since $PREV_TAG"
              else
                echo "## Fork changes (not in upstream)"
              fi
              echo
              if [ -s new-fork.tsv ]; then render '###' < new-fork.tsv; else echo "No new changelog entries."; echo; fi
              if [ -s new-upstream.tsv ]; then
                echo "## From upstream since $PREV_TAG"
                echo
                render '###' < new-upstream.tsv
              fi
              if [ -s prs.md ]; then
                echo "## Fork pull requests"
                echo
                cat prs.md
                echo
              fi
              echo "## Verify"
              echo
              echo "Every file is signed with the fork CI key, not upstream's: \`dbflux fork CI (decrypted/dbflux)\`, fingerprint \`$(echo "$FORK_KEY_FINGERPRINT" | sed -E 's/(.{4})/\1 /g; s/ $//')\`."
              echo
              echo '```'
              echo "sha256sum -c --ignore-missing SHA256SUMS"
              echo "gpg --verify SHA256SUMS.asc SHA256SUMS"
              echo '```'
              if [ -n "$PREV_TAG" ]; then
                echo
                echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
              fi
            } > release_body.md
          }

          compose
          if [ "$(wc -c < release_body.md)" -gt 120000 ]; then
            echo "::warning::Release notes exceed GitHub's limit; listing entry titles only."
            COMPACT=1 compose
          fi
          cat release_body.md

      - name: Collect the notes and the changelog
        run: |
          mkdir notes
          cp release_body.md notes/release_body.md
          # The whole changelog as of the tag, for readers who want more than this release's
          # entries; signed and listed in SHA256SUMS like the packages.
          cp CHANGELOG.md notes/CHANGELOG.md

      - name: Upload the notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign release files
    needs: [version, build, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that sees GPG_PRIVATE_KEY and GPG_PASSPHRASE. With the secrets in the
    # `release` environment, its required reviewer and its tag policy (v*-d.*) gate them: no
    # other job, branch or unapproved run can read the key. It checks out nothing, runs no code
    # from the repository, installs nothing and uses only the first-party artifact actions.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: "{linux,macos,windows}-*"
          merge-multiple: false

      - name: Download the notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Verify the artifact set and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Exactly the files the build jobs make for channel rc, nothing else: no .asc (the
          # builds must not sign), no .zsync (rc embeds no update information).
          declare -A payloads=(
            [linux-amd64]="dbflux-linux-amd64.tar.gz dbflux-x86_64.AppImage dbflux_${VERSION}_linux_amd64.deb dbflux-linux-amd64.deb dbflux-${VERSION}-1.x86_64.rpm dbflux-linux-amd64.rpm"
            [linux-arm64]="dbflux-linux-arm64.tar.gz dbflux-aarch64.AppImage dbflux_${VERSION}_linux_arm64.deb dbflux-linux-arm64.deb dbflux-${VERSION}-1.aarch64.rpm dbflux-linux-arm64.rpm"
            [macos-amd64]="dbflux-macos-amd64.dmg"
            [macos-arm64]="dbflux-macos-arm64.dmg"
            [windows-amd64]="dbflux-windows-amd64.zip dbflux-windows-amd64-setup.exe"
          )

          found=$(find artifacts -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          wanted=$(printf '%s\n' "${!payloads[@]}" | LC_ALL=C sort)
          if [ "$found" != "$wanted" ]; then
            echo "::error::Expected the artifacts $(tr '\n' ' ' <<< "$wanted"), got $(tr '\n' ' ' <<< "$found")."
            exit 1
          fi

          for dir in "${!payloads[@]}"; do
            if [ -n "$(find "artifacts/$dir" -mindepth 1 ! -type f -print -quit)" ]; then
              echo "::error::Artifact $dir holds something that is not a regular file."
              exit 1
            fi
            read -r -a expected <<< "${payloads[$dir]}"
            for file in "artifacts/$dir"/*; do
              name=$(basename "$file")
              case " ${payloads[$dir]} " in
                *" $name "*) ;;
                *)
                  if [[ "$name" != *.sha256 ]]; then
                    echo "::error::Unexpected file $dir/$name."
                    exit 1
                  fi
                  ;;
              esac
            done
            checksums=("artifacts/$dir"/*.sha256)
            if [ "${#checksums[@]}" -eq 0 ]; then
              echo "::error::Artifact $dir has no .sha256 files."
              exit 1
            fi
            listed=$(cat "${checksums[@]}" | tr -d '\r' | awk '{ sub(/^\*/, "", $2); print $2 }' | LC_ALL=C sort -u)
            for name in "${expected[@]}"; do
              [ -f "artifacts/$dir/$name" ] || { echo "::error::$dir/$name is missing."; exit 1; }
              grep -qFx "$name" <<< "$listed" || { echo "::error::No .sha256 lists $dir/$name."; exit 1; }
            done
            while IFS= read -r name; do
              case " ${payloads[$dir]} " in
                *" $name "*) ;;
                *) echo "::error::A .sha256 in $dir lists $name, which is not a package."; exit 1 ;;
              esac
            done <<< "$listed"
            (cd "artifacts/$dir" && sha256sum --strict -c ./*.sha256)
          done

          mkdir dist
          for file in artifacts/*/* notes/CHANGELOG.md; do
            name=$(basename "$file")
            if [ -e "dist/$name" ]; then
              echo "::error::Two files are named $name."
              exit 1
            fi
            cp "$file" "dist/$name"
          done

          (
            cd dist
            # Every file except the per-file .sha256; written next to dist/ so it cannot list itself.
            find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\n' \
              | LC_ALL=C sort | xargs sha256sum > ../SHA256SUMS
            mv ../SHA256SUMS SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Prepare a throwaway keyring
        run: |
          install -d -m 700 "$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is empty: the sign job needs it (in the release environment or at repo level)."
            exit 1
          fi
          # Armored, or base64 of the key as crazy-max/ghaction-import-gpg also accepts.
          case "$GPG_PRIVATE_KEY" in
            *"-----BEGIN PGP PRIVATE KEY BLOCK-----"*) printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import ;;
            *) printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import ;;
          esac

          # Exactly one secret key, and it is the fork key.
          primaries=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }')
          if [ "$primaries" != "$FORK_KEY_FINGERPRINT" ]; then
            echo "::error::GPG_PRIVATE_KEY holds $(tr '\n' ' ' <<< "$primaries"), expected only the fork key $FORK_KEY_FINGERPRINT."
            exit 1
          fi

      - name: Sign every file and SHA256SUMS
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd dist
          sign() {
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$FORK_KEY_FINGERPRINT!" --armor --detach-sign --output "$1.asc" "$1"
          }
          # SHA256SUMS lists every published file except the per-file .sha256.
          while IFS= read -r name; do
            sign "$name"
          done < <(cut -c 67- SHA256SUMS)
          sign SHA256SUMS

      - name: Verify the signatures
        run: |
          set -euo pipefail
          cd dist
          sha256sum --strict -c SHA256SUMS
          count=0
          for signature in *.asc; do
            status=$(gpg --batch --status-fd 1 --verify "$signature" "${signature%.asc}" 2>/dev/null)
            if ! grep -q '^\[GNUPG:\] GOODSIG ' <<< "$status" \
                || ! grep -q "^\[GNUPG:\] VALIDSIG $FORK_KEY_FINGERPRINT " <<< "$status"; then
              echo "::error::$signature is not a good signature by $FORK_KEY_FINGERPRINT."
              exit 1
            fi
            count=$((count + 1))
          done
          # One per SHA256SUMS line, plus SHA256SUMS itself.
          [ "$count" -eq "$(( $(wc -l < SHA256SUMS) + 1 ))" ] || { echo "::error::$count signatures for $(wc -l < SHA256SUMS) files."; exit 1; }
          ls -l

      - name: Remove the keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

      - name: Upload the signed files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [version, notes, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the signed files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-release
          path: dist

      - name: Download the notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Check the signed files
        run: |
          set -euo pipefail
          cd dist
          sha256sum --strict -c SHA256SUMS
          test -s SHA256SUMS.asc

      - name: Create the release
        # A draft with every asset first, published in a last step: with immutable releases no
        # asset can be added to a published release. A published release is never changed again;
        # a draft left by a failed attempt is refreshed.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          title="DBFlux $TAG (decrypted fork)"
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "$draft" in
            missing)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
                --title "$title" --notes-file notes/release_body.md dist/*
              ;;
            true)
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
                --title "$title" --notes-file notes/release_body.md
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
              ;;
            *)
              echo "::error::Release $TAG is already published and is not changed again. Cut the next v<X.Y.Z>-d.<N> instead."
              exit 1
              ;;
          esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
