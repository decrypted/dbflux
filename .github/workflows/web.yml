name: Web

# The site renders the repository's own markdown, so a change to any of it can
# break the build even when no file under web/ was touched. Triggering on all
# markdown costs a needless 30-second build for a file the site does not read,
# and buys never having to edit this list when a document moves.
#
# No push trigger: a commit reaches main only through a squash-merged pull
# request, and this workflow already built it there. Nothing deploys from it.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'web/**'
      - '**/*.md'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production ${{ matrix.mode }}
    # Fork guard (decrypted/dbflux): builds upstream's site and docs, which the fork has no
    # use for, so it never runs outside upstream.
    if: github.repository == '0xErwin1/dbflux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [site, docs]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The site reads each published version's docs out of its own git ref,
          # so a shallow clone cannot build anything but the current branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11

      # No pnpm cache: it is saved once per branch, so every open PR adds a
      # near-identical ~170 MB entry that pushes the repository past its 10 GB
      # cache limit and evicts the Rust build caches. A frozen install from the
      # registry takes seconds.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install MCP worker
        working-directory: web/mcp
        run: pnpm install --frozen-lockfile

      - name: Types (MCP worker)
        working-directory: web/mcp
        run: pnpm check

      - name: Format
        working-directory: web
        run: pnpm format:check

      - name: Types
        working-directory: web
        run: DOCS_MODE=${{ matrix.mode }} pnpm check

      - name: Build
        working-directory: web
        run: pnpm build:${{ matrix.mode }}

      - name: Audit distribution
        working-directory: web
        run: pnpm audit:dist --mode ${{ matrix.mode }}

      - name: Check for links to pages that do not exist
        working-directory: web
        run: node scripts/check-links.ts
